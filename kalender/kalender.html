<!DOCTYPE html>
<html lang="id">
<head>

<link rel="stylesheet" href="../css/style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<section class="breadcrumb-section">

            <span class="active">Kalender Pendidikan</span>

    </div>

<section id="kalender" class="kalender">

            <button data-tab="calendar"><i class="fas fa-calendar-days"></i> Kalender Bulanan</button>
        </div>

        <div id="tab-dashboard" class="kalender-tab active"><div id="dashboardContent"></div></div>
        <div id="tab-table" class="kalender-tab"><div id="tableContent"></div></div>
        <div id="tab-calendar" class="kalender-tab"><div id="calendarContent"></div></div>
